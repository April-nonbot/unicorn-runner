<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Unicorn Runner — Smooth Edition</title>
<style>
  :root{
    --ui-bg: rgba(255,255,255,0.95);
    --accent1: #ff9ad1;
    --accent2: #ffd87f;
    --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,#eaf8ff 0%, #fff5fb 100%);font-family:var(--ui-font);-webkit-text-size-adjust:100%}
  .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px}
  header{width:100%;max-width:980px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{background:linear-gradient(90deg,var(--accent1),var(--accent2));padding:8px 12px;border-radius:10px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,0.08)}
  .controls{display:flex;gap:10px;align-items:center}
  .stat{background:rgba(255,255,255,0.7);padding:8px 12px;border-radius:10px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,0.05)}
  button{font-size:16px;padding:10px 12px;border-radius:10px;border:0;background:var(--ui-bg);box-shadow:0 8px 24px rgba(0,0,0,0.06);cursor:pointer}
  button:active{transform:translateY(1px)}
  .stage{width:100%;max-width:980px;display:flex;justify-content:center}
  canvas{width:100%;height:360px;border-radius:14px;display:block;touch-action:none;-webkit-tap-highlight-color:transparent;box-shadow:0 18px 48px rgba(18,30,50,0.12)}
  /* Shop */
  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.42);z-index:50}
  .modal.open{display:flex}
  .card{width:92%;max-width:820px;background:#fff;border-radius:12px;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,0.16)}
  .maps{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
  .map-card{flex:1 1 230px;border-radius:10px;border:1px solid rgba(0,0,0,0.06);overflow:hidden;display:flex;flex-direction:column}
  .map-preview{height:110px;display:flex;align-items:center;justify-content:center;background:#f7fbff}
  .map-info{display:flex;justify-content:space-between;align-items:center;padding:10px}
  .map-btn{padding:8px 10px;border-radius:8px;border:0;background:linear-gradient(90deg,var(--accent1),var(--accent2));cursor:pointer;font-weight:700}
  /* ensure iOS won't auto-zoom interactive text */
  button,input,textarea{font-size:16px}
  @media (max-width:560px){ canvas{height:260px} }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <div class="logo">🦄 Unicorn Runner</div>
        <div style="color:#444;font-weight:600">Tap to jump • Collect coins • Buy maps</div>
      </div>

      <div class="controls">
        <div id="score" class="stat">Score: 0</div>
        <div id="coins" class="stat">Coins: 0</div>
        <button id="shopBtn">Shop</button>
        <button id="restartBtn">Restart</button>
      </div>
    </header>

    <div class="stage">
      <canvas id="canvas" width="1200" height="540"></canvas>
    </div>
  </div>

  <!-- Shop modal -->
  <div id="shopModal" class="modal" aria-hidden="true">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
      <h2 id="shopTitle" style="margin:0 0 8px 0">Shop — Unlock Maps</h2>
      <div class="maps" id="maps"></div>
      <div style="margin-top:10px;color:#666;font-size:13px">Tap a map to select or buy it. Close by tapping outside.</div>
    </div>
  </div>

<script>
/*
  Smooth Edition improvements:
   - Retina-aware canvas scaling
   - Softer clouds using shadowBlur and overlapping ellipses
   - Coins with radial gradients
   - Player: emoji rendered at high-res for crispness
   - Map previews rendered as SVG (vector) so they remain sharp
*/

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let DPR = Math.max(window.devicePixelRatio || 1, 1);
function resizeCanvas() {
  // Keep CSS size for responsiveness, but set internal pixel size multiplied by DPR
  const cssW = canvas.clientWidth || 900;
  const cssH = canvas.clientHeight || 360;
  canvas.width = Math.round(cssW * DPR);
  canvas.height = Math.round(cssH * DPR);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); // scale drawing to css pixels
}
resizeCanvas();
window.addEventListener('resize', ()=> { DPR = Math.max(window.devicePixelRatio || 1, 1); resizeCanvas(); });

// UI elements
const scoreEl = document.getElementById('score');
const coinsEl = document.getElementById('coins');
const shopBtn = document.getElementById('shopBtn');
const restartBtn = document.getElementById('restartBtn');
const shopModal = document.getElementById('shopModal');
const mapsContainer = document.getElementById('maps');

// Game state
let state = 'menu';
let score = 0;
let coins = parseInt(localStorage.getItem('ur_coins') || '0', 10);
let best = parseInt(localStorage.getItem('ur_best') || '0', 10);
let unlocked = JSON.parse(localStorage.getItem('ur_unlocked') || '["Classic"]');

const maps = [
  {name:'Classic', price:0, key:'classic'},
  {name:'Sunset', price:20, key:'sunset'},
  {name:'Neon', price:50, key:'neon'}
];

// Player
const player = { x: 120, size: 72, y: 0, vy: 0, onGround: true };
const groundY = 300;
let gravity = 0.78, jumpVel = -13;

// world
let obstacles = [], coinsList = [];
let spawnTimer = 0, coinTimer = 0;
let baseSpeed = 5;

// clouds as layered soft shapes
let cloudLayers = [
  {speed: 0.18, clouds: []},
  {speed: 0.36, clouds: []},
  {speed: 0.66, clouds: []}
];

function newCloud(layerIdx){
  const w = 120 + Math.random() * 220;
  return { x: canvas.clientWidth + Math.random() * 240, y: 40 + layerIdx * 36 + Math.random() * 80, w, h: 40 + Math.random()*20, opacity: 0.9 - layerIdx * 0.18};
}
cloudLayers.forEach((L)=> { for(let i=0;i<4;i++) L.clouds.push(newCloud(cloudLayers.indexOf(L))); });

// helpers
function rand(a,b){ return Math.random()*(b-a)+a; }
function rectsOverlap(a,b){ return !(a.x + a.w < b.x || a.x > b.x + b.w || a.y + a.h < b.y || a.y > b.y + b.h); }

// input
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if(state === 'menu') startGame();
  else if(state === 'playing') jump();
  else if(state === 'dead') startGame();
});
window.addEventListener('keydown', (e) => {
  if(e.code === 'Space') {
    e.preventDefault();
    if(state === 'menu') startGame();
    else if(state === 'playing') jump();
    else if(state === 'dead') startGame();
  }
});
restartBtn.addEventListener('click', startGame);
shopBtn.addEventListener('click', toggleShop);
shopModal.addEventListener('pointerdown', (e) => { if(e.target === shopModal) toggleShop(); });

// Shop UI: SVG previews (vector, crisp)
function makeMapCard(map) {
  const card = document.createElement('div'); card.className = 'map-card';
  const preview = document.createElement('div'); preview.className = 'map-preview';
  // add inline SVG (vector) so preview stays sharp
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 360 180');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
  svg.style.width = '100%'; svg.style.height = '100%';
  // background rectangle
  const rect = document.createElementNS(svgNS, 'rect');
  rect.setAttribute('x', 0); rect.setAttribute('y', 0); rect.setAttribute('width', 360); rect.setAttribute('height', 180);
  // draw theme-dependent shapes
  if(map.key === 'classic'){
    rect.setAttribute('fill', 'url(#gradClassic)');
    const defs = document.createElementNS(svgNS, 'defs');
    const g = document.createElementNS(svgNS, 'linearGradient'); g.setAttribute('id','gradClassic'); g.setAttribute('x1','0'); g.setAttribute('y1','0'); g.setAttribute('x2','0'); g.setAttribute('y2','1');
    const s1 = document.createElementNS(svgNS, 'stop'); s1.setAttribute('offset','0'); s1.setAttribute('stop-color','#a7f3d0');
    const s2 = document.createElementNS(svgNS, 'stop'); s2.setAttribute('offset','0.6'); s2.setAttribute('stop-color','#bde0ff');
    const s3 = document.createElementNS(svgNS, 'stop'); s3.setAttribute('offset','1'); s3.setAttribute('stop-color','#ffd6f0');
    g.appendChild(s1); g.appendChild(s2); g.appendChild(s3); defs.appendChild(g); svg.appendChild(defs);
    svg.appendChild(rect);
    // rainbow arcs (vector)
    const colors = ['#ff5c8a','#ff9f43','#ffd43b','#5ce1e6','#7ee7a6'];
    for(let i=0;i<5;i++){
      const path = document.createElementNS(svgNS,'path');
      const r = 120 - i*12;
      path.setAttribute('d', `M20 160 A ${r} ${r} 0 0 1 200 160`);
      path.setAttribute('stroke', colors[i]); path.setAttribute('stroke-width', 14 - i*2); path.setAttribute('fill','none'); path.setAttribute('stroke-linecap','round');
      svg.appendChild(path);
    }
  } else if(map.key === 'sunset'){
    const defs = document.createElementNS(svgNS, 'defs');
    const g = document.createElementNS(svgNS,'linearGradient'); g.setAttribute('id','gradSun'); g.setAttribute('x1','0');g.setAttribute('y1','0');g.setAttribute('x2','0');g.setAttribute('y2','1');
    g.innerHTML = '<stop offset="0" stop-color="#FFE0E8"/><stop offset="1" stop-color="#B5FFFC"/>';
    defs.appendChild(g); svg.appendChild(defs);
    rect.setAttribute('fill','url(#gradSun)'); svg.appendChild(rect);
    // sun
    const sun = document.createElementNS(svgNS,'circle'); sun.setAttribute('cx', 300); sun.setAttribute('cy', 40); sun.setAttribute('r', 24); sun.setAttribute('fill','#FFD27F');
    svg.appendChild(sun);
    // soft clouds vector
    for(let i=0;i<3;i++){
      const c = document.createElementNS(svgNS,'ellipse'); c.setAttribute('cx', 50 + i*110); c.setAttribute('cy', 50 + (i%2)*6); c.setAttribute('rx', 36); c.setAttribute('ry', 18); c.setAttribute('fill','rgba(255,255,255,0.9)');
      svg.appendChild(c);
    }
  } else if(map.key === 'neon'){
    const defs = document.createElementNS(svgNS, 'defs');
    const g = document.createElementNS(svgNS,'linearGradient'); g.setAttribute('id','gradNeon'); g.setAttribute('x1','0');g.setAttribute('y1','0');g.setAttribute('x2','0');g.setAttribute('y2','1');
    g.innerHTML = '<stop offset="0" stop-color="#10002b"/><stop offset="1" stop-color="#240046"/>';
    defs.appendChild(g); svg.appendChild(defs);
    rect.setAttribute('fill','url(#gradNeon)'); svg.appendChild(rect);
    for(let i=0;i<5;i++){
      const stripe = document.createElementNS(svgNS,'rect'); stripe.setAttribute('x', i*70); stripe.setAttribute('y', 60 + (i%2)*-18); stripe.setAttribute('width', 36); stripe.setAttribute('height', 100); stripe.setAttribute('fill','rgba(255,255,255,0.06)');
      svg.appendChild(stripe);
    }
  }
  preview.appendChild(svg);
  card.appendChild(preview);

  const info = document.createElement('div'); info.className='map-info';
  const title = document.createElement('div'); title.textContent = map.name;
  const btn = document.createElement('button'); btn.className='map-btn';
  if(unlocked.includes(map.name)){
    btn.textContent = 'Select';
    btn.onclick = () => { unlocked = unlocked.filter(n => n !== map.name); unlocked.push(map.name); localStorage.setItem('ur_unlocked', JSON.stringify(unlocked)); renderMaps(); toggleShop(); };
  } else {
    btn.textContent = `Buy ${map.price}`;
    btn.onclick = () => {
      if(coins >= map.price){ coins -= map.price; localStorage.setItem('ur_coins', coins); unlocked.push(map.name); localStorage.setItem('ur_unlocked', JSON.stringify(unlocked)); renderMaps(); updateUI(); }
      else { btn.textContent = 'Need more coins'; setTimeout(renderMaps, 900); }
    };
  }
  info.appendChild(title); info.appendChild(btn);
  card.appendChild(info);
  return card;
}

function renderMaps(){
  mapsContainer.innerHTML = '';
  maps.forEach(m => mapsContainer.appendChild(makeMapCard(m)));
}
renderMaps();

function toggleShop(){ const open = shopModal.classList.toggle('open'); shopModal.setAttribute('aria-hidden', String(!open)); if(open) renderMaps(); }

// Update UI
function updateUI(){ scoreEl.textContent = 'Score: ' + Math.floor(score) + (best ? ` (Best ${best})` : ''); coinsEl.textContent = 'Coins: ' + coins; localStorage.setItem('ur_coins', coins); }

// Game functions
function jump(){ if(player.onGround){ player.vy = jumpVel; player.onGround = false; } }

function startGame(){
  score = 0; obstacles = []; coinsList = []; spawnTimer = 0; coinTimer = 0;
  player.y = groundY - player.size; player.vy = 0; player.onGround = true;
  state = 'playing'; updateUI();
}

function gameOver(){ state = 'dead'; if(Math.floor(score) > best){ best = Math.floor(score); localStorage.setItem('ur_best', best); } updateUI(); }

// Update loop
let last = performance.now();
function loop(now){
  const dtRaw = Math.min(40, now - last); last = now;
  const dt = dtRaw / 16.67;
  if(state === 'playing') update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt){
  const speed = baseSpeed + Math.floor(score/100);
  // physics
  player.vy += gravity;
  player.y += player.vy;
  if(player.y + player.size >= groundY){ player.y = groundY - player.size; player.vy = 0; player.onGround = true; } else player.onGround = false;

  // spawn obstacles
  spawnTimer -= dt;
  if(spawnTimer <= 0){
    spawnTimer = rand(60,140) - Math.min(score/5,40);
    obstacles.push({ x: canvas.clientWidth + 60, y: groundY - rand(40,90), w: 48, h: rand(28,54), speed: speed + rand(0,2) });
  }
  // spawn coins
  coinTimer -= dt;
  if(coinTimer <= 0){
    coinTimer = rand(90,200);
    coinsList.push({ x: canvas.clientWidth + 60, y: groundY - rand(90,160), r: 10, speed });
  }

  // move obstacles & coins
  for(let i = obstacles.length-1; i>=0; i--){
    const o = obstacles[i]; o.x -= o.speed;
    if(o.x + o.w < -40) obstacles.splice(i,1);
    else {
      const pbox = { x: player.x + 10, y: player.y + 10, w: player.size - 20, h: player.size - 14 };
      if(rectsOverlap(pbox, o)) { gameOver(); }
    }
  }
  for(let i = coinsList.length-1; i>=0; i--){
    const c = coinsList[i]; c.x -= c.speed;
    if(c.x + c.r < -40) coinsList.splice(i,1);
    else {
      const px = player.x + player.size/2, py = player.y + player.size/2;
      const dx = px - c.x, dy = py - c.y;
      if(dx*dx + dy*dy < (c.r + player.size*0.45)*(c.r + player.size*0.45)){
        coins += 1; localStorage.setItem('ur_coins', coins); coinsList.splice(i,1); updateUI();
      }
    }
  }

  // clouds
  cloudLayers.forEach((L, idx) => {
    L.clouds.forEach(c => c.x -= L.speed * (0.6 + speed*0.06));
    for(let i=L.clouds.length-1;i>=0;i--) if(L.clouds[i].x + L.clouds[i].w < -60) L.clouds.splice(i,1);
    while(L.clouds.length < 4) L.clouds.push(newCloud(idx));
  });

  score += dt * 0.6 * (1 + Math.min(score/1000,2));
  updateUI();
}

// Drawing (soft clouds, gradients, emoji)
function draw(){
  const W = canvas.clientWidth, H = canvas.clientHeight;
  ctx.clearRect(0,0,W,H);

  drawSky(ctx, W, H);
  drawClouds(ctx);
  drawGround(ctx, W, H);

  // draw obstacles
  obstacles.forEach(o => {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.shadowColor = 'rgba(0,0,0,0.08)';
    ctx.shadowBlur = 12;
    roundRect(ctx, o.x, o.y, o.w, o.h, 10, true);
    ctx.restore();
  });

  // draw coins
  coinsList.forEach(c => drawCoin(ctx, c.x, c.y, c.r));

  // draw player emoji crisp: set font large (canvas is DPR-scaled)
  drawEmojiPlayer(ctx, player.x, player.y, player.size);

  // overlay map label
  const chosen = unlocked[unlocked.length-1] || 'Classic';
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.8)'; roundRect(ctx, 12, 12, 220, 36, 10, true);
  ctx.fillStyle = '#222'; ctx.font = '14px Arial'; ctx.fillText('Map: ' + chosen, 22, 34);
  ctx.restore();

  if(state === 'menu'){
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; roundRect(ctx, W/2 - 160, H/2 - 70, 320, 140, 12, true);
    ctx.fillStyle = '#fff'; ctx.font = '20px Arial'; ctx.fillText('Tap to start — Unicorn Runner', W/2 - 120, H/2 - 30);
    ctx.font = '14px Arial'; ctx.fillText('Tap anywhere to jump. Collect coins to buy maps!', W/2 - 130, H/2 + 4);
    ctx.restore();
  } else if(state === 'dead'){
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; roundRect(ctx, W/2 - 160, H/2 - 70, 320, 140, 12, true);
    ctx.fillStyle = '#fff'; ctx.font = '22px Arial'; ctx.fillText('You crashed!', W/2 - 60, H/2 - 28);
    ctx.font = '16px Arial'; ctx.fillText('Score: ' + Math.floor(score) + '  Coins: ' + coins, W/2 - 90, H/2 + 6);
    ctx.restore();
  }
}

function drawSky(ctx, W, H){
  const t = performance.now() * 0.00008;
  const g = ctx.createLinearGradient(0,0,0,H);
  const v = Math.sin(t) * 0.05;
  g.addColorStop(0, `hsl(${200 + v*8}, 82%, 90%)`);
  g.addColorStop(0.6, `hsl(${210 + v*6}, 85%, 95%)`);
  g.addColorStop(1, `hsl(${320 + v*12}, 95%, 98%)`);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}

function drawClouds(ctx){
  cloudLayers.forEach((L, idx) => {
    ctx.save();
    ctx.globalAlpha = 1;
    L.clouds.forEach(c => drawSoftCloud(ctx, c.x, c.y, c.w, c.h, c.opacity));
    ctx.restore();
  });
}
function drawSoftCloud(ctx,x,y,w,h,opacity){
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.shadowColor = 'rgba(0,0,0,0.06)';
  ctx.shadowBlur = 20;
  const puff = Math.max(3, Math.floor(w / 60));
  for(let i=0;i<puff;i++){
    const px = x + (i - puff/2) * (w * 0.22);
    const py = y + Math.sin(i + x*0.01) * (h * 0.06);
    ctx.beginPath();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.ellipse(px, py, w*0.22 + Math.abs(Math.sin(i))*6, h*0.54 + (i%2)*4, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawGround(ctx, W, H){
  ctx.save();
  ctx.fillStyle = '#79c267'; ctx.fillRect(0, groundY, W, H - groundY);
  // subtle horizon shadow
  ctx.fillStyle = 'rgba(0,0,0,0.04)'; ctx.fillRect(0, groundY, W, 6);
  ctx.restore();
}

// coins with radial gradient and soft shadow
function drawCoin(ctx,x,y,r){
  ctx.save();
  ctx.beginPath();
  const g = ctx.createRadialGradient(x - r*0.25, y - r*0.25, r*0.1, x, y, r);
  g.addColorStop(0, '#fff9d6'); g.addColorStop(0.35, '#fff0a8'); g.addColorStop(1, '#f2b800');
  ctx.fillStyle = g;
  ctx.shadowColor = 'rgba(0,0,0,0.12)';
  ctx.shadowBlur = 8;
  ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawEmojiPlayer(ctx, x, y, size){
  ctx.save();
  // use a font size proportional to 'size' (we're drawing on DPR-scaled canvas)
  ctx.font = `${Math.round(size)}px serif`;
  ctx.textBaseline = 'alphabetic';
  // place emoji so it sits neatly on the ground by tweaking offset
  const offsetY = Math.round(size * 0.06);
  ctx.fillText('🦄', x, y + size + offsetY);
  ctx.restore();
}

// utility: rounded rect
function roundRect(ctx,x,y,w,h,r,fill){
  if(!r) r=8;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(fill) ctx.fill();
}

// initial player position
player.y = groundY - player.size;
updateUI();

// main animation
function animate(now){
  loop(now);
}
requestAnimationFrame(animate);

// expose startGame for console if needed
window.UNICORN = { startGame };

// ensure canvases are crisp after paste/resizing
resizeCanvas();
renderMaps();
</script>
</body>
</html>
